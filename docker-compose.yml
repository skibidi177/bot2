services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot
      POSTGRES_DB: bot2
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bot -d bot2']
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    command: ['node', 'dist/db/migrate.js']
    environment:
      DATABASE_URL: postgresql://bot:bot@db:5432/bot2
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  bot:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://bot:bot@db:5432/bot2
    ports:
      - '8080:8080'
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
